server {
    listen 80;
    server_name CoreXGaming.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name CoreXGaming.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/corexgaming.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corexgaming.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /var/www/store-app/public;
    index index.php index.html;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.env$ {
        deny all;
    }

    location ~ /storage/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /pulse {
        try_files $uri $uri/ /index.php?$query_string;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    client_max_body_size 20M;
}
